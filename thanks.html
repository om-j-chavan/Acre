<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Thank you — Acre</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="header-mount"></div>

<div class="success" id="success"></div>

<div id="footer-mount"></div>

<script src="js/products.js"></script>
<script src="js/app.js"></script>
<script>
  mountChrome();
  const order = JSON.parse(localStorage.getItem('acre_last_order')||'null');
  const el = document.getElementById('success');
  if(!order){
    el.innerHTML = `<h1>No recent order</h1><p class="muted">Browse the shop to begin.</p><a href="shop.html" class="btn primary">Shop</a>`;
  } else {
    const ship = order.shipping===0?'Free':fmt(order.shipping);
    const methodLabel = SHIPPING[order.method].label;
    el.innerHTML = `
      <div class="ok">✓</div>
      <span class="eyebrow">Order confirmed</span>
      <h1>Thank you, ${order.name.split(' ')[0]}.</h1>
      <p class="muted" style="max-width:54ch;margin:14px auto 0">A confirmation has been sent to <strong>${order.email}</strong>. Each piece is carefully packed and shipped from our Melbourne studio.</p>
      <div class="order-no">Order ${order.no}</div>
      <div style="text-align:left;max-width:520px;margin:0 auto;border-top:1px solid var(--line);padding-top:24px">
        ${order.items.map(i=>`
          <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:.9rem">
            <span>${i.name} × ${i.qty}</span>
            <span>${fmt(i.price*i.qty)}</span>
          </div>`).join('')}
        <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:.9rem;border-top:1px solid var(--line);margin-top:10px"><span>Subtotal</span><span>${fmt(order.subtotal)}</span></div>
        <div style="display:flex;justify-content:space-between;padding:10px 0;font-size:.9rem"><span>${methodLabel}</span><span>${ship}</span></div>
        <div style="display:flex;justify-content:space-between;padding:14px 0;font-family:var(--serif);font-size:1.3rem;border-top:1px solid var(--line);margin-top:6px"><span>Total</span><span>${fmt(order.total)}</span></div>
      </div>
      <div style="margin-top:40px"><a href="shop.html" class="btn">Continue shopping</a></div>`;
  }
</script>
</body>
</html>
